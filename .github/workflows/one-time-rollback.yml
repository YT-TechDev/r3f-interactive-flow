name: One-time v2.8.0 baseline rollback

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

env:
  EXPECTED_BASE: b5de5df765e7330127da56502ba81917558ad15f
  TARGET_COMMIT: 3187d2e819f3cbcdb0c26aea6142a79afb4d4ae9

jobs:
  rollback:
    name: Resolve v2.8.0 baseline tree
    if: github.head_ref == 'revert/to-v2.8.0-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout rollback branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: revert/to-v2.8.0-baseline

      - name: Verify source and record exact target tree
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git cat-file -e "$TARGET_COMMIT^{commit}"
          git rev-parse "$TARGET_COMMIT^{tree}" > rollback-target-tree.txt
          test -s rollback-target-tree.txt

      - name: Upload target tree SHA
        uses: actions/upload-artifact@v4
        with:
          name: rollback-target-tree
          path: rollback-target-tree.txt
          if-no-files-found: error
          retention-days: 1
