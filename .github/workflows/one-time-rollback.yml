name: One-time v2.8.0 baseline rollback

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  rollback:
    name: Restore v2.8.0 baseline tree
    if: github.head_ref == 'revert/to-v2.8.0-baseline' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout rollback branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: revert/to-v2.8.0-baseline

      - name: Verify rollback source and restore target tree
        env:
          EXPECTED_BASE: b5de5df765e7330127da56502ba81917558ad15f
          TARGET_COMMIT: 3187d2e819f3cbcdb0c26aea6142a79afb4d4ae9
          TARGET_BRANCH: revert/to-v2.8.0-baseline
          WORKFLOW_PATH: .github/workflows/one-time-rollback.yml
        run: |
          set -euo pipefail

          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git cat-file -e "$TARGET_COMMIT^{commit}"

          cp "$WORKFLOW_PATH" /tmp/one-time-rollback.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git restore --source="$TARGET_COMMIT" --staged --worktree -- .
          test "$(git write-tree)" = "$(git rev-parse "$TARGET_COMMIT^{tree}")"

          mkdir -p "$(dirname "$WORKFLOW_PATH")"
          cp /tmp/one-time-rollback.yml "$WORKFLOW_PATH"
          git add "$WORKFLOW_PATH"

          git commit -m "revert: restore v2.8.0 baseline"
          test "$(git diff --name-only "$TARGET_COMMIT" HEAD)" = "$WORKFLOW_PATH"
          git push origin "HEAD:$TARGET_BRANCH"
