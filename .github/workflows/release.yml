name: Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type publish to confirm an intentional npm publish from main."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish'

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@11.5.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install exact npm CLI for Trusted Publishing
        run: npm install --global npm@12.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Safe release verification
        run: pnpm release:check

      - name: Publish with npm Trusted Publishing
        run: npm publish ./packages/r3f-interactive-flow --access public
